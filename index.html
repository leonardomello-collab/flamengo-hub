<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel do Hub · Flamengo</title>
<style>
:root{
  --ground:#F6F5F7; --surface:#FFF; --sunken:#EEECEF; --raise:#FAFAFB;
  --ink:#17151A; --ink-2:#4C4752; --ink-3:#837C8B; --rule:#DFDAE2; --rule-2:#C9C2CD;
  --accent:#C8102E; --accent-soft:#F6DBE0;
  --good:#1C6E52; --bad:#A3272F; --bad-soft:#F8DEDF;
  --c1:#C8102E; --c2:#2F6FB7; --c3:#0E8F6E; --c4:#B5780A; --c5:#7A4FB5;
  --mono:"Cascadia Mono",Consolas,"SF Mono",ui-monospace,monospace;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 1px 2px rgba(20,15,25,.06),0 4px 12px rgba(20,15,25,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#121115; --surface:#1A181D; --sunken:#232028; --raise:#201E25;
  --ink:#F3F0F5; --ink-2:#BEB7C6; --ink-3:#8C8497; --rule:#2F2B36; --rule-2:#413B49;
  --accent:#F2556E; --accent-soft:#3B1A22; --good:#5FC79C; --bad:#F07A82; --bad-soft:#3B1C1F;
  --c1:#E8435C; --c2:#4A8BD6; --c3:#1FA37C; --c4:#BE8A1E; --c5:#9A72DB;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.22);
}}
:root[data-theme="dark"]{
  --ground:#121115; --surface:#1A181D; --sunken:#232028; --raise:#201E25;
  --ink:#F3F0F5; --ink-2:#BEB7C6; --ink-3:#8C8497; --rule:#2F2B36; --rule-2:#413B49;
  --accent:#F2556E; --accent-soft:#3B1A22; --good:#5FC79C; --bad:#F07A82; --bad-soft:#3B1C1F;
  --c1:#E8435C; --c2:#4A8BD6; --c3:#1FA37C; --c4:#BE8A1E; --c5:#9A72DB;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.22);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.num{font-variant-numeric:tabular-nums}
#porta{position:fixed;inset:0;background:var(--ground);display:grid;place-items:center;z-index:100;padding:24px}
.porta-cx{width:100%;max-width:380px;text-align:center}
.brasao{width:52px;height:52px;margin:0 auto 20px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px}
.porta-cx h1{font-size:1.3rem;margin:0 0 6px}
.porta-cx p{color:var(--ink-3);font-size:13.5px;margin:0 0 24px}
#senha{width:100%;padding:13px 15px;border:1px solid var(--rule-2);border-radius:8px;background:var(--surface);color:var(--ink);font-size:16px;text-align:center}
#entrar{width:100%;margin-top:10px;padding:13px;border-radius:8px;background:var(--accent);color:#fff;font-weight:600}
#entrar:disabled{opacity:.5;cursor:wait}
#erro{color:var(--bad);font-size:13px;margin-top:12px;min-height:18px}
#app{display:none}
header.topo{background:var(--surface);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:20}
.faixa{max-width:1560px;margin:0 auto;padding:0 20px}
.linha1{display:flex;align-items:center;gap:16px;padding:12px 0;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:10px;font-weight:700}
.marca i{width:26px;height:26px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;font-style:normal}
.carimbo{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);text-align:right}
.abas{display:flex;gap:2px;border-top:1px solid var(--rule);overflow-x:auto}
.ab{padding:11px 15px;font-size:13.5px;font-weight:550;color:var(--ink-3);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.ab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:1560px;margin:0 auto;padding:22px 20px 80px}
h2.tt{font-size:1.02rem;font-weight:650;margin:0 0 2px}
p.sb{font-size:13px;color:var(--ink-3);margin:0 0 14px}
.bloco{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px;min-width:0}
.bloco>header{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.alerta-fonte{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);border-radius:8px;padding:10px 14px;margin:0 0 16px;font-size:13px}
.alerta-fonte ul{margin:4px 0 0;padding-left:18px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--sunken);border-radius:7px;padding:2px}
.seg button{padding:5px 11px;border-radius:5px;font-size:12.5px;font-weight:550;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
select,input[type="date"]{padding:6px 10px;border:1px solid var(--rule);border-radius:7px;background:var(--surface);color:var(--ink);font-size:12.5px}
label.mini{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 15px;box-shadow:var(--shadow)}
.kpi .rot{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:7px}
.kpi .val{font-size:1.5rem;font-weight:700;line-height:1.05}
.kpi .var{font-size:11.5px;font-family:var(--mono);margin-top:5px}
.up{color:var(--good)} .dn{color:var(--bad)} .flat{color:var(--ink-3)}
.gr{width:100%;overflow-x:auto}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.gx text,.gy text{font-size:10px;fill:var(--ink-3);font-family:var(--mono)}
.gy line{stroke:var(--rule);stroke-dasharray:2 3}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);margin-top:10px}
.leg i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--ground);padding:7px 10px;border-radius:6px;font-size:11.5px;font-family:var(--mono);z-index:60;opacity:0;white-space:pre;line-height:1.45}
.tw{overflow-x:auto;border:1px solid var(--rule);border-radius:9px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 13px;text-align:left;border-bottom:1px solid var(--rule);white-space:nowrap}
thead th{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);background:var(--sunken)}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
td.vazio{color:var(--ink-3);text-align:center}
.duas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr));gap:16px}
.duas>.bloco{margin-bottom:0}
.duas{margin-bottom:16px}
details.glos{margin:4px 0 16px;font-size:13px;color:var(--ink-2)}
details.glos summary{cursor:pointer;color:var(--ink-3);font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
details.glos dt{font-weight:650;margin-top:10px;color:var(--ink)}
details.glos dd{margin:2px 0 0}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;color:inherit;text-decoration:none;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-2px);border-color:var(--rule-2)}
.card .thumb{position:relative;aspect-ratio:1;background:var(--sunken);overflow:hidden}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card .semimg{display:grid;place-items:center;height:100%;color:var(--ink-3);font-size:11px;font-family:var(--mono)}
.card .selos{position:absolute;top:7px;left:7px;display:flex;gap:4px}
.card .selo{font-family:var(--mono);font-size:9.5px;font-weight:700;padding:2.5px 6px;border-radius:4px;background:rgba(0,0,0,.72);color:#fff}
.card .selo.b{background:rgba(200,16,46,.92)}
.card .cx{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .dt{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.card .lg{font-size:12.5px;line-height:1.35;margin:0;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .nums{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin-top:auto}
.card .nums b{font-size:15px;font-variant-numeric:tabular-nums}
.card .inf{font-size:11px;color:var(--ink-3)}
.barra-partes{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:2px 0 8px;background:var(--sunken)}
.barra-partes span{display:block;height:100%}
table.hm{border-collapse:separate;border-spacing:2px;width:auto}
table.hm td{width:26px;height:22px;padding:0;border:0;border-radius:3px;text-align:center;font-size:9.5px;font-family:var(--mono)}
table.hm th{padding:2px 5px;font-size:9.5px;background:none;border:0}
.rod{max-width:1560px;margin:0 auto;padding:0 20px 40px;font-size:12px;color:var(--ink-3)}
@media (max-width:600px){.faixa,main,.rod{padding-left:16px;padding-right:16px}.carimbo{margin-left:0;text-align:left}}

.kpis.cl{margin-bottom:0}
.kpis.cl .kpi{box-shadow:none;background:var(--raise)}
.alerta-info{background:var(--raise);border:1px solid var(--rule-2);border-left:3px solid var(--accent);border-radius:8px;padding:11px 14px;margin:0 0 16px;font-size:13px;color:var(--ink-2)}
.alerta-info code{font-family:var(--mono);font-size:12px}
.nota{font-size:12.5px;color:var(--ink-3);margin:10px 0 0}
h2.sec{font-size:1.15rem;font-weight:700;margin:26px 0 12px}
h2.sec:first-child{margin-top:0}
h3.st{font-size:12.5px;font-weight:650;margin:0 0 8px;color:var(--ink-2)}
.bloco h3.st:not(:first-child){margin-top:16px}
a.lk{color:inherit;text-decoration:underline;text-decoration-color:var(--rule-2);text-underline-offset:2px}
a.lk:hover{text-decoration-color:var(--accent)}
td.qb{white-space:normal;min-width:260px;max-width:520px;line-height:1.35}
.mini-t{font-size:11px;color:var(--ink-3);margin-top:2px}
.sel{font-family:var(--mono);font-size:9.5px;font-weight:700;padding:1.5px 5px;border-radius:4px;background:var(--sunken);color:var(--ink-2);margin-left:4px}
.bh{display:flex;flex-direction:column;gap:7px}
.bl{display:grid;grid-template-columns:minmax(0,min(46%,260px)) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.bn{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{height:10px;background:var(--sunken);border-radius:5px;overflow:hidden;min-width:40px}
.bt i{display:block;height:100%;border-radius:5px}
.bv{font-size:12px;color:var(--ink);text-align:right;min-width:52px}
button.lnk{font-size:12.5px;color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--rule-2);text-underline-offset:2px;padding:0}
.cam{display:inline-flex;flex-wrap:wrap;gap:3px;align-items:center;white-space:normal;line-height:1.3}
.cam em{font-style:normal}
.cam b{color:var(--ink-3);font-weight:400;margin:0 1px}
.bh:has(.cam) .bl{grid-template-columns:minmax(0,62%) 1fr auto}
.bh:has(.cam) .bn{white-space:normal}
table.mx td.hc,table.hm td.hc{text-align:center;font-family:var(--mono);font-size:11px;padding:6px 6px;border:1px solid var(--surface);border-bottom:1px solid var(--surface)}
table.mx th{font-size:10px;letter-spacing:.04em;text-transform:none;padding:7px 8px;background:var(--sunken);color:var(--ink-2);white-space:nowrap;font-family:var(--body);font-weight:600;text-align:left}
table.mx thead th{font-family:var(--mono);color:var(--ink-3)}
table.mx thead th.r{text-align:center}
table.mx td.r{padding:6px 9px}
td.hc.nulo{background:transparent}
table.hm td.hc{width:24px;min-width:18px;height:22px;padding:0;border-radius:3px}
.tres{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:22px}
.ctl input[type="search"]{padding:6px 10px;border:1px solid var(--rule);border-radius:7px;background:var(--surface);color:var(--ink);font-size:12.5px;min-width:180px}
select.largo{max-width:min(520px,100%)}
label.chk{font-size:12.5px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
button.vermais{margin-top:10px;font-size:12.5px;color:var(--accent);font-weight:600;padding:6px 2px}
.mira{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 2}
.bloco.barra{padding:12px 16px}
.bloco.barra .seg button{white-space:nowrap}
.abas{overflow-y:hidden}
.gr{overflow-x:hidden}
@media (max-width:600px){.bl{grid-template-columns:minmax(0,42%) 1fr auto;gap:7px}td.qb{min-width:200px}.bh:has(.cam) .bl{grid-template-columns:1fr auto}.bh:has(.cam) .bt{display:none}}
</style>
</head>
<body>
<div id="porta">
  <div class="porta-cx">
    <div class="brasao">CRF</div>
    <h1>Painel do Hub</h1>
    <p>Conteúdo restrito. Informe a senha do mês.</p>
    <form id="fporta">
      <input id="senha" type="password" placeholder="senha" autocomplete="off" autofocus>
      <button id="entrar" type="submit">Abrir painel</button>
    </form>
    <div id="erro" role="alert"></div>
  </div>
</div>

<div id="app">
  <header class="topo">
    <div class="faixa">
      <div class="linha1">
        <div class="marca"><i>CRF</i> Painel do Hub</div>
        <div class="carimbo" id="carimbo"></div>
      </div>
      <div class="abas" id="abas" role="tablist"></div>
    </div>
  </header>
  <main>
    <div id="avisos"></div>
    <div id="periodo"></div>
    <section id="conteudo"></section>
  </main>
  <footer class="rod" id="rodape"></footer>
</div>

<script>
"use strict";
const CFG = {"sal": "3aNq6wD5hRHBCW2rX6wxrg==", "iv": "iYKBbUiQnXhYCpU6", "iter": 250000};

/* ============================ abertura ============================ */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(senha){
  const dados = b64(document.getElementById("payload").textContent.trim());
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
  const chave = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(CFG.sal), iterations:CFG.iter, hash:"SHA-256"},
                                              base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const claro = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(CFG.iv)}, chave, dados);
  const fluxo = new Blob([claro]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(fluxo).text());
}

let D = null, B = null, P = null, ABA = "geral", PID = "30d";
const UI = {metrica:"usuarios", edit:"", idioma:"", q:"", maisNoticias:false, tema:"", semMarca:false, pagina:"",
            hist:"sessoes", maisTermos:false};

document.getElementById("fporta").addEventListener("submit", async e => {
  e.preventDefault();
  const bt = document.getElementById("entrar"), er = document.getElementById("erro");
  bt.disabled = true; er.textContent = ""; bt.textContent = "Abrindo…";
  try{
    D = await abrir(document.getElementById("senha").value);
    document.getElementById("porta").style.display = "none";
    document.getElementById("app").style.display = "block";
    iniciar();
  }catch(_){
    er.textContent = "Senha incorreta.";
    bt.disabled = false; bt.textContent = "Abrir painel";
    document.getElementById("senha").select();
  }
});

/* ============================ formatação ============================ */
const nf = new Intl.NumberFormat("pt-BR");
const nf2 = new Intl.NumberFormat("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2});
const vazio = v => v === null || v === undefined || (typeof v === "number" && !isFinite(v));
function fmt(v){
  if(vazio(v)) return "—";
  const a = Math.abs(v);
  if(a >= 1e6) return (v/1e6).toFixed(2).replace(".", ",") + " mi";
  if(a >= 1e4) return (v/1e3).toFixed(a >= 1e5 ? 0 : 1).replace(".", ",") + " mil";
  return nf.format(Math.round(v));
}
const brl  = v => vazio(v) ? "—" : "R$ " + fmt(v);
const brl2 = v => vazio(v) ? "—" : "R$ " + nf2.format(v);
const int  = v => vazio(v) ? "—" : nf.format(Math.round(v));
const pc   = v => vazio(v) ? "—" : (v*100).toFixed(1).replace(".", ",") + "%";
const dec  = v => vazio(v) ? "—" : v.toFixed(2).replace(".", ",");
const dec1 = v => vazio(v) ? "—" : v.toFixed(1).replace(".", ",");
const seg  = s => { if(vazio(s)) return "—"; const t = Math.round(s); return t < 60 ? t + " s" : Math.floor(t/60) + " min " + String(t%60).padStart(2, "0") + " s"; };
const dbr  = s => { if(!s) return "—"; const [a, m, d] = s.slice(0, 10).split("-"); return d + "/" + m; };
const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const mesbr = s => MESES[+s.slice(5, 7) - 1] + "/" + s.slice(2, 4);
const esc  = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;"}[c]));
const el = (t, a, h) => { const n = document.createElement(t); if(a) for(const k in a){ if(k === "cls") n.className = a[k]; else n.setAttribute(k, a[k]); } if(h !== undefined) n.innerHTML = h; return n; };
const add = (c, h) => c.insertAdjacentHTML("beforeend", h);
const div = (a, b) => b ? a / b : null;
function varTxt(a, b, sufixo){
  if(vazio(a) || vazio(b) || !b) return `<span class="flat">sem comparação</span>`;
  const v = (a/b - 1)*100, c = v > 0.5 ? "up" : v < -0.5 ? "dn" : "flat";
  return `<span class="${c}">${(v >= 0 ? "+" : "") + v.toFixed(1).replace(".", ",")}%</span>${sufixo || ""}`;
}
function varPts(a, b){
  if(vazio(a) || vazio(b)) return `<span class="flat">sem comparação</span>`;
  const v = (a - b)*100, c = v > 0.05 ? "up" : v < -0.05 ? "dn" : "flat";
  return `<span class="${c}">${(v >= 0 ? "+" : "") + v.toFixed(1).replace(".", ",")} p.p.</span>`;
}
const ligacao = (caminho, texto) => /^\//.test(caminho) ? `<a class="lk" href="https://www.flamengo.com.br${esc(caminho)}" target="_blank" rel="noopener noreferrer">${esc(texto)}</a>` : esc(texto);

/* ============================ peças de layout ============================ */
function tabela(cols, linhas){
  const cab = cols.map(c => `<th${c.r ? ' class="r"' : ""}>${esc(c.t)}</th>`).join("");
  const corpo = linhas.length
    ? linhas.map(o => `<tr>${cols.map(c => `<td class="${(c.r ? "r " : "") + (c.w ? "qb" : "")}">${c.f(o)}</td>`).join("")}</tr>`).join("")
    : `<tr><td colspan="${cols.length}" class="vazio">Sem dados no período.</td></tr>`;
  return `<div class="tw"><table><thead><tr>${cab}</tr></thead><tbody>${corpo}</tbody></table></div>`;
}
const bloco = (titulo, sub, corpo) => `<div class="bloco"><header><div><h2 class="tt">${esc(titulo)}</h2>${sub ? `<p class="sb">${sub}</p>` : ""}</div></header>${corpo}</div>`;
const kpi = (rot, val, v) => `<div class="kpi"><span class="rot">${esc(rot)}</span><div class="val num">${val}</div><div class="var">${v || ""}</div></div>`;
const nota = t => `<p class="nota">${t}</p>`;
const glossario = itens => `<details class="glos"><summary>Como ler esta aba</summary><dl>${itens.map(([t, d]) => `<dt>${esc(t)}</dt><dd>${d}</dd>`).join("")}</dl></details>`;
const duas = (a, b) => `<div class="duas">${a}${b}</div>`;
function barras(itens, opc){
  opc = opc || {};
  const mx = Math.max(1, ...itens.map(i => i.v || 0));
  if(!itens.length) return `<p class="sb">Sem dados no período.</p>`;
  return `<div class="bh">${itens.map(i => `<div class="bl" title="${esc(i.d || "")}"><span class="bn">${i.h || esc(i.n)}</span><span class="bt"><i style="width:${Math.max(.6, (i.v || 0)/mx*100)}%;background:${i.c || opc.cor || "var(--c1)"}"></i></span><span class="bv num">${i.t}</span></div>`).join("")}</div>`;
}
const corCalor = f => `color-mix(in srgb, var(--accent) ${Math.round(f*100)}%, var(--surface))`;
const celula = (f, txt, dica) => f === null || f === undefined
  ? `<td class="hc nulo"></td>`
  : `<td class="hc" style="background:${corCalor(f)};color:${f > .55 ? "#fff" : "var(--ink-2)"}" title="${esc(dica || "")}">${txt}</td>`;

/* ============================ gráfico ============================ */
const tip = document.getElementById("tip");
function mostraTip(e, txt){ tip.textContent = txt; tip.style.opacity = 1;
  tip.style.left = Math.max(8, Math.min(e.clientX + 13, innerWidth - tip.offsetWidth - 10)) + "px";
  tip.style.top = Math.max(8, e.clientY - tip.offsetHeight - 10) + "px"; }
function escondeTip(){ tip.style.opacity = 0; }

/** Um só eixo. series: [{nome, cor, valores:[n|null], tipo:'linha'|'barra', fmt}]
 *  opc: {faixas:[bool], marcos:[{i, cor, txt}], fmtY, h} */
function grafico(series, rotulos, opc){
  opc = opc || {};
  const L = 60, R = 16, T0 = 14, B0 = 28, W = 960, H = opc.h || 240, iw = W - L - R, ih = H - T0 - B0;
  let mx = 0; series.forEach(s => s.valores.forEach(v => { if(v != null) mx = Math.max(mx, v); })); if(!mx) mx = 1;
  const posY = v => T0 + ih - (v/mx)*ih;
  const n = rotulos.length, passoX = n < 2 ? 0 : iw/(n - 1);
  const temBarra = series.some(s => s.tipo === "barra");
  const larg = n < 2 ? iw/2 : (temBarra ? iw/n : passoX);
  const px = i => n < 2 ? L + iw/2 : temBarra ? L + (i + .5)*iw/n : L + i*passoX;
  const fy = opc.fmtY || fmt, faixas = opc.faixas || [];
  let g = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s => s.nome).join(", "))}">`;
  faixas.forEach((f, i) => { if(f) g += `<rect x="${px(i) - larg/2}" y="${T0}" width="${larg}" height="${ih}" fill="var(--sunken)"/>`; });
  g += `<g class="gy">`;
  for(let k = 0; k <= 4; k++){ const v = mx*k/4, y = posY(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 7}" y="${y + 3}" text-anchor="end">${fy(v)}</text>`; }
  g += `</g><g class="gx">`;
  const passo = Math.max(1, Math.ceil(n/10));
  const quebra = i => i === n - 1 ? false : (n - 1 - i) < passo*0.6;   // o último rótulo não encosta no penúltimo
  rotulos.forEach((r, i) => { if((i % passo === 0 && !quebra(i)) || i === n - 1) g += `<text x="${px(i)}" y="${H - 9}" text-anchor="${i === n - 1 && !temBarra ? "end" : "middle"}">${esc(r)}</text>`; });
  g += `</g>`;
  series.forEach(s => {
    if(s.tipo === "barra"){
      const bw = Math.max(1.5, larg*0.62);
      s.valores.forEach((v, i) => { if(v == null) return; const y = posY(v);
        g += `<rect x="${px(i) - bw/2}" y="${y}" width="${bw}" height="${Math.max(1, T0 + ih - y)}" fill="${(s.cores && s.cores[i]) || s.cor}" rx="${Math.min(3, bw/2)}"/>`; });
    }else{
      let d = "", aberto = false;
      s.valores.forEach((v, i) => { if(v == null){ aberto = false; return; } d += (aberto ? " L" : " M") + px(i) + " " + posY(v); aberto = true; });
      g += `<path d="${d}" fill="none" stroke="${s.cor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
  });
  const porI = {};
  (opc.marcos || []).forEach(m => { if(m.i < 0) return; (porI[m.i] = porI[m.i] || []).push(m.txt);
    g += `<line x1="${px(m.i)}" x2="${px(m.i)}" y1="${T0}" y2="${T0 + ih}" stroke="${m.cor}" stroke-dasharray="2 3"/><circle cx="${px(m.i)}" cy="${T0 + 5}" r="4" fill="${m.cor}" stroke="var(--surface)" stroke-width="2"/>`; });
  g += `<line class="mira" x1="0" x2="0" y1="${T0}" y2="${T0 + ih}" style="opacity:0"/>`;
  rotulos.forEach((r, i) => {
    const linhas = [r + (faixas[i] ? " · sem medição" : "")]
      .concat(series.map(s => `${s.nome}: ${s.valores[i] == null ? "—" : (s.fmt || fmt)(s.valores[i])}`))
      .concat(porI[i] || []);
    g += `<rect class="alvo" x="${px(i) - larg/2}" y="${T0}" width="${Math.max(larg, 1)}" height="${ih}" fill="transparent" data-x="${px(i)}" data-t="${esc(linhas.join("\n"))}"/>`;
  });
  g += `</svg>`;
  const box = el("div", {cls:"gr"}, g), mira = box.querySelector(".mira");
  box.querySelectorAll("rect.alvo").forEach(r => {
    r.addEventListener("mousemove", e => { mostraTip(e, r.getAttribute("data-t")); if(!temBarra){ mira.setAttribute("x1", r.dataset.x); mira.setAttribute("x2", r.dataset.x); mira.style.opacity = 1; } });
    r.addEventListener("mouseleave", () => { escondeTip(); mira.style.opacity = 0; });
  });
  const wrap = el("div"); wrap.append(box);
  const itensLeg = series.length > 1 ? series.map(s => `<span><i style="background:${s.cor}"></i>${esc(s.nome)}</span>`) : [];
  if(opc.legendaMarcos) itensLeg.push(...opc.legendaMarcos);
  if(faixas.some(Boolean)) itensLeg.push(`<span><i style="background:var(--sunken);border:1px solid var(--rule-2)"></i>${esc(opc.rotuloFaixa || "sem medição")}</span>`);
  if(itensLeg.length) wrap.append(el("div", {cls:"leg"}, itensLeg.join("")));
  return wrap;
}
function blocoGrafico(c, titulo, sub, g, extra){
  const b = el("div", {cls:"bloco"}, `<header><div><h2 class="tt">${esc(titulo)}</h2>${sub ? `<p class="sb">${sub}</p>` : ""}</div>${extra || ""}</header>`);
  b.append(g); c.append(b); return b;
}
const diasDoPeriodo = () => D.serie.filter(r => r.data >= P.ini && r.data <= P.fim);
function marcosJogos(rot){
  return D.jogos.map(j => {
    const i = rot.indexOf(dbr(j.data)); if(i < 0) return null;
    return {i, cor:"var(--ink-3)", txt:`Jogo: ${j.adversario} (${j.mando || ""}) ${j.placar || ""} · ${j.competicao || ""}`};
  }).filter(Boolean);
}
const legJogo = `<span><i style="background:var(--ink-3);border-radius:50%"></i>jogo do futebol masculino profissional</span>`;
function seletor(id, ops, atual){
  return `<div class="seg" id="${id}">${ops.map(([v, t]) => `<button data-v="${esc(v)}" aria-pressed="${String(v) === String(atual)}">${esc(t)}</button>`).join("")}</div>`;
}
function ligaSeletor(raiz, id, f){ raiz.querySelectorAll(`#${id} button`).forEach(b => b.onclick = () => f(b.dataset.v)); }

/* ============================ 1. Visão geral ============================ */
function secGeral(c){
  const k = B.kpis, a = B.kpis_ant || {};
  add(c, `<div class="kpis">
    ${kpi("Usuários", fmt(k.usuarios), varTxt(k.usuarios, a.usuarios))}
    ${kpi("Novos", pc(k.pct_novos), `${fmt(k.novos)} · ` + varPts(k.pct_novos, a.pct_novos))}
    ${kpi("Sessões", fmt(k.sessoes), varTxt(k.sessoes, a.sessoes))}
    ${kpi("Páginas vistas", fmt(k.pv), varTxt(k.pv, a.pv))}
    ${kpi("Páginas por sessão", dec(k.pv_sessao), varTxt(k.pv_sessao, a.pv_sessao))}
    ${kpi("Sessões engajadas", pc(k.pct_engajadas), varPts(k.pct_engajadas, a.pct_engajadas))}
    ${kpi("Tempo por sessão", seg(k.tempo_sessao_s), varTxt(k.tempo_sessao_s, a.tempo_sessao_s))}
    ${kpi("Logados (piso)", fmt(k.logados), pc(k.pct_logados) + " dos usuários")}
  </div>`);
  const dias = diasDoPeriodo(), rot = dias.map(r => dbr(r.data));
  const nomes = {usuarios:"Usuários por dia", sessoes:"Sessões", pv:"Páginas vistas"};
  const b = blocoGrafico(c, nomes[UI.metrica] === "Usuários por dia" ? nomes.usuarios : nomes[UI.metrica] + " por dia", "Cada ponto é um dia. Passe o mouse para ver o valor e o jogo.",
    grafico([{nome:nomes[UI.metrica], cor:"var(--c1)", valores:dias.map(r => r[UI.metrica])}], rot, {marcos:marcosJogos(rot), legendaMarcos:[legJogo]}),
    seletor("sMet", [["usuarios", "Usuários"], ["sessoes", "Sessões"], ["pv", "Páginas vistas"]], UI.metrica));
  ligaSeletor(b, "sMet", v => { UI.metrica = v; render(); });
  add(c, duas(
    bloco("Áreas do site", "Parcela das páginas vistas no período.",
      barras(B.areas.map(x => ({n:x.grupo, v:x.pv, t:pc(x.pct), d:`${int(x.pv)} páginas vistas · ${int(x.entradas)} entradas · ${seg(x.tempo_s)} por sessão`})))),
    bloco("Páginas mais vistas", "",
      tabela([{t:"Página", w:1, f:o => ligacao(o.path, o.titulo)}, {t:"Área", f:o => esc(o.grupo)}, {t:"Vistas", r:1, f:o => int(o.pv)}, {t:"Entradas", r:1, f:o => int(o.entradas)}],
             B.paginas.slice(0, 12)))));
  // comparação com o ano anterior usa a tela do GA4 dos dois lados
  const mesRef = /^\d{4}-\d{2}$/.test(PID) && P.fechado ? PID : ultimoMesFechado();
  const h = D.historico.meses, atual = h.find(x => x.mes === mesRef);
  if(atual){
    const antes = h.find(x => x.mes === String(+mesRef.slice(0, 4) - 1) + mesRef.slice(4));
    add(c, bloco(`${mesbr(mesRef)} contra o mesmo mês do ano anterior`, `Números da tela do GA4 nos dois lados (a tela estima quem não consentiu, o export não). Série completa na aba Histórico.`,
      `<div class="kpis cl">${kpi("Sessões", fmt(atual.sessoes), varTxt(atual.sessoes, antes && antes.sessoes))}${kpi("Usuários", fmt(atual.usuarios), varTxt(atual.usuarios, antes && antes.usuarios))}${kpi("Páginas vistas", fmt(atual.pv), varTxt(atual.pv, antes && antes.pv))}</div>`));
  }
  const Q = B.nao_encontradas;
  if(Q.pv) add(c, bloco("Páginas não encontradas", `${int(Q.pv)} visitas (${pc(div(Q.pv, k.pv))} das páginas vistas) caíram em uma página de erro: links quebrados no site, no Google ou em posts.`,
    tabela([{t:"Endereço", w:1, f:o => ligacao(o.path, o.path)}, {t:"Visitas", r:1, f:o => int(o.pv)}, {t:"Entraram direto", r:1, f:o => int(o.entradas)}], Q.paginas.slice(0, 8))));
  add(c, glossario([
    ["Usuários", "Navegadores distintos que aceitaram a medição. Quem troca de aparelho ou limpa os cookies conta de novo."],
    ["Consentimento", `${pc(k.pct_sem_consent)} das páginas vistas chegaram sem consentimento: entram em "Páginas vistas" e "Sessões", mas não têm usuário. Por isso usuários ficam abaixo da tela do GA4, que estima esse grupo, e engajamento, tempo e páginas por sessão contam só quem consentiu.`],
    ["Sessão engajada", "Durou mais de 10 segundos, teve 2 ou mais páginas ou teve uma conversão."],
    ["Logados (piso)", `O site só identifica o login em banners, vitrines e buscas, e só desde ${dbr(D.inicio_user_id)}. Quem só lê uma notícia logado não conta: o número real é maior.`],
    ["Entradas", "Sessões que começaram naquela página."],
  ]));
}
function ultimoMesFechado(){
  const fechados = D.periodos.filter(p => /^\d{4}-\d{2}$/.test(p.id) && p.fechado);
  return fechados.length ? fechados[0].id : null;
}

/* ============================ 2. Notícias ============================ */
function secNoticias(c){
  const N = B.noticias, eds = N.editorias.filter(e => e.editoria !== "Ingressos");
  const pvT = eds.reduce((s, e) => s + e.pv, 0), semIng = N.lista.filter(x => x.editoria !== "Ingressos");
  add(c, `<div class="kpis">
    ${kpi("Vistas de notícias", fmt(pvT), "sem as de ingressos")}
    ${kpi("Notícias vistas", int(eds.reduce((s, e) => s + e.textos, 0)), "pelo menos uma visita")}
    ${kpi("Novas no período", int(eds.reduce((s, e) => s + e.novos, 0)), "1ª visita dentro do período")}
    ${kpi("Vistas por notícia", fmt(div(pvT, eds.reduce((s, e) => s + e.textos, 0))), "média")}
  </div>`);
  const edOps = [...new Set(N.lista.map(x => x.editoria))].sort();
  const b = el("div", {cls:"bloco"}, `<header><div><h2 class="tt">Notícias mais acessadas</h2><p class="sb">As de ingressos têm aba própria e só aparecem aqui se você escolher a editoria.</p></div>
    <div class="ctl"><select id="fEd" aria-label="Editoria"><option value="">Todas, sem ingressos</option>${edOps.map(e => `<option${e === UI.edit ? " selected" : ""}>${esc(e)}</option>`).join("")}</select>
    <select id="fIdi" aria-label="Idioma"><option value="">Todos os idiomas</option>${["PT", "EN", "ES"].map(e => `<option${e === UI.idioma ? " selected" : ""}>${e}</option>`).join("")}</select>
    <input id="fQ" type="search" placeholder="Buscar no título" value="${esc(UI.q)}"></div></header><div id="lN"></div>`);
  c.append(b);
  const desenha = () => {
    const q = UI.q.trim().toLowerCase();
    const l = N.lista.filter(x => (UI.edit ? x.editoria === UI.edit : x.editoria !== "Ingressos") && (!UI.idioma || x.idioma === UI.idioma) && (!q || x.titulo.toLowerCase().includes(q)));
    const vis = UI.maisNoticias ? l : l.slice(0, 25);
    b.querySelector("#lN").innerHTML = tabela([
      {t:"Notícia", w:1, f:o => ligacao(o.path, o.titulo) + (o.idioma !== "PT" ? ` <span class="sel">${o.idioma}</span>` : "") + ((D.termos_pagina[o.path] || [])[0] ? `<div class="mini-t">Google: ${esc(D.termos_pagina[o.path][0][0])}</div>` : "")},
      {t:"Editoria", f:o => esc(o.editoria)}, {t:"Vistas", r:1, f:o => int(o.pv)}, {t:"Sessões", r:1, f:o => int(o.sessoes)},
      {t:"Tempo", r:1, f:o => seg(o.tempo_s)}, {t:"Rolou até o fim", r:1, f:o => pc(o.rolagem)}, {t:"Entrou direto", r:1, f:o => pc(o.pct_entrada)}, {t:"1ª visita", r:1, f:o => dbr(o.primeira)}], vis)
      + (l.length > 25 ? `<button class="vermais" id="vmN">${UI.maisNoticias ? "Ver menos" : `Ver todas (${l.length})`}</button>` : "");
    const vm = b.querySelector("#vmN"); if(vm) vm.onclick = () => { UI.maisNoticias = !UI.maisNoticias; desenha(); };
  };
  desenha();
  b.querySelector("#fEd").onchange = e => { UI.edit = e.target.value; desenha(); };
  b.querySelector("#fIdi").onchange = e => { UI.idioma = e.target.value; desenha(); };
  b.querySelector("#fQ").oninput = e => { UI.q = e.target.value; desenha(); };
  add(c, bloco("Editorias", "", tabela([{t:"Editoria", f:o => esc(o.editoria)}, {t:"Notícias", r:1, f:o => int(o.textos)}, {t:"Novas", r:1, f:o => int(o.novos)}, {t:"Vistas", r:1, f:o => int(o.pv)},
    {t:"Vistas por notícia", r:1, f:o => int(o.pv_por_texto)}, {t:"Tempo", r:1, f:o => seg(o.tempo_s)}, {t:"Rolou até o fim", r:1, f:o => pc(o.rolagem)}], N.editorias)));
  add(c, glossario([
    ["Rolou até o fim", "Parcela das sessões que chegou a 90% da altura da página."],
    ["Entrou direto", "Parcela das sessões que começou nessa notícia, vinda de fora do site."],
    ["Google", "O termo do Google que mais trouxe gente para a notícia nos últimos 30 dias, quando o Search Console mostra."],
    ["1ª visita", `Primeiro dia em que a página apareceu nos dados (desde ${dbr(D.inicio_export)}). Serve como aproximação da publicação.`],
    ["Lista", "Mostra as 150 mais vistas do período."],
  ]));
}

/* ============================ 3. Ingressos ============================ */
function secIngressos(c){
  const I = B.ingressos, k = B.kpis;
  add(c, `<div class="kpis">
    ${kpi("Sessões em ingressos", fmt(I.ingressos), pc(div(I.ingressos, I.sessoes)) + " das sessões do site")}
    ${kpi("Também foram a Entrar", fmt(I.ingressos_entrar), pc(div(I.ingressos_entrar, I.ingressos)) + " delas")}
    ${kpi("Clicaram em venda", fmt(I.ingressos_venda), pc(div(I.ingressos_venda, I.ingressos)) + " delas")}
  </div>`);
  if(P.ini < D.inicio_clique_clube) add(c, `<div class="alerta-info"><b>O site de ingressos do clube só é medido desde ${dbr(D.inicio_clique_clube)}.</b> Até essa data, "Clicaram em venda" cobre só vendedores de fora do domínio, como o site de outro clube mandante. A partir dela, inclui também <code>ingressos.flamengo.com.br</code>, o site de venda do próprio clube. Por isso, este período não mede a demanda total por ingresso, e o número muda de patamar nessa data.</div>`);
  const dias = diasDoPeriodo(), rot = dias.map(r => dbr(r.data));
  const iClube = rot.indexOf(dbr(D.inicio_clique_clube));
  const marcosVenda = marcosJogos(rot).concat(iClube >= 0 ? [{i:iClube, cor:"var(--c4)", txt:"Começa a medição de ingressos.flamengo.com.br"}] : []);
  const legendaVenda = [legJogo].concat(iClube >= 0 ? [`<span><i style="background:var(--c4);border-radius:50%"></i>começa a medição do site de ingressos do clube</span>`] : []);
  blocoGrafico(c, "Sessões em páginas de ingressos, por dia", "", grafico([{nome:"Sessões em ingressos", cor:"var(--c1)", valores:dias.map(r => r.ingressos)}], rot, {marcos:marcosJogos(rot), legendaMarcos:[legJogo]}));
  blocoGrafico(c, "Cliques em sites de venda, por dia", "Sessões que clicaram em algum site de venda.", grafico([{nome:"Sessões com clique em venda", cor:"var(--c2)", valores:dias.map(r => r.clicou_venda), tipo:"barra"}], rot, {marcos:marcosVenda, legendaMarcos:legendaVenda, h:190}));
  add(c, duas(
    bloco("Sites de venda", "Reconhecidos pelo endereço ou por receberem clique de uma notícia de ingressos, então um vendedor novo entra sozinho.",
      tabela([{t:"Site", f:o => esc(o.dominio)}, {t:"Cliques", r:1, f:o => int(o.cliques)}, {t:"Sessões", r:1, f:o => int(o.sessoes)}, {t:"De", r:1, f:o => dbr(o.de)}, {t:"Até", r:1, f:o => dbr(o.ate)}], I.sites)),

/* ============================ 5. Buscas ============================ */

      ${kpi("Taxa de clique", pc(G.ctr), "cliques ÷ impressões")}

      b.querySelector("#temas").innerHTML = barras(G.temas.map(t => ({n:t.tema, h:`<button class="lnk" data-t="${esc(t.tema)}">${esc(t.tema)}</button>`, v:t.cliques, t:int(t.cliques), d:`${int(t.impressoes)} impressões · ${pc(t.ctr)} de taxa de clique`})));
      b.querySelectorAll("button.lnk").forEach(x => x.onclick = () => { UI.tema = UI.tema === x.dataset.t ? "" : x.dataset.t; tb.querySelector("#fTema").value = UI.tema; lista(); });

      tb.querySelector("#lT").innerHTML = tabela([{t:"Busca", w:1, f:o => esc(o.consulta)}, {t:"Tema", f:o => esc(o.tema)}, {t:"Cliques", r:1, f:o => int(o.cliques)}, {t:"Impressões", r:1, f:o => int(o.impressoes)}, {t:"Taxa", r:1, f:o => pc(o.ctr)}, {t:"Posição", r:1, f:o => dec1(o.posicao)}], vis)

    ["Sem a marca", "Buscas sem Flamengo, Mengão, CRF, Nação ou Maracanã. Mostram quem chegou sem procurar o clube pelo nome."],
    ["Temas", "Agrupamento automático pelas palavras da busca. Um termo fora das regras cai em \"Outros\"."],
    ["Clicou em produto", "Sessões que abriram algum produto depois da busca. Não cobre quem buscou algo que não é produto, como ingresso ou biometria."],
    ["Termo repetido", "Banner que leva a uma busca pronta conta como busca, mesmo sem ninguém ter digitado."],
  ]));
}

/* ============================ 6. Fluxos ============================ */
function secFluxos(c){
  const F = B.fluxos;
  add(c, bloco("Caminhos mais comuns", `Sequência de áreas em cada sessão (${fmt(F.sessoes)} sessões). Áreas repetidas em seguida contam uma vez. Clique para fora do site é um passo.`,
    barras(F.caminhos.slice(0, 18).map(x => ({n:x.caminho, h:`<span class="cam">${esc(x.caminho).split(" &gt; ").map(p => `<em>${p}</em>`).join("<b>›</b>")}</span>`, v:x.n, t:pc(x.pct), d:`${int(x.n)} sessões`})), {})));
  const ord = F.areas.map(a => a.area);
  const de = ["(entrada)"].concat(ord), para = ord.concat(["(saiu)"]);
  const idx = {}; F.matriz.forEach(m => { idx[m.de + "|" + m.para] = m.n; });
  const nome = a => a === "(entrada)" ? "Início da sessão" : a === "(saiu)" ? "Saiu" : a;
  let m = `<div class="tw"><table class="mx"><thead><tr><th>De ↓ / Para →</th>${para.map(p => `<th class="r">${esc(nome(p))}</th>`).join("")}</tr></thead><tbody>`;
  de.forEach(d => {
    const tot = para.reduce((s, p) => s + (idx[d + "|" + p] || 0), 0);
    m += `<tr><th>${esc(nome(d))}</th>`;
    para.forEach(p => { const n = idx[d + "|" + p] || 0, f = tot ? n/tot : 0;
      m += f >= .0005 ? celula(Math.min(1, f*1.4), pc(f).replace(",0%", "%"), `${nome(d)} → ${nome(p)}: ${int(n)}`) : `<td class="hc nulo"></td>`; });
    m += `</tr>`;
  });
  m += `</tbody></table></div>`;
  add(c, bloco("De onde para onde", "Cada linha soma 100%: de cada área, para onde a sessão foi em seguida.", m));
  add(c, bloco("Entradas e saídas por área", "", tabela([{t:"Área", f:o => esc(o.area)}, {t:"Entradas", r:1, f:o => int(o.entradas)}, {t:"% das entradas", r:1, f:o => pc(o.pct_entrada)}, {t:"Passagens", r:1, f:o => int(o.passagens)}, {t:"Saídas", r:1, f:o => int(o.saidas)}, {t:"% que sai dali", r:1, f:o => pc(o.pct_saida)}], F.areas)));
  if(!UI.pagina || !F.explorador.find(x => x.path === UI.pagina)) UI.pagina = F.explorador.length ? F.explorador[0].path : "";
  const b = el("div", {cls:"bloco"}, `<header><div><h2 class="tt">De onde vem e para onde vai, página a página</h2><p class="sb">As ${F.explorador.length} páginas mais vistas. Mostra as passagens que se repetem, então a soma não fecha 100%.</p></div>
    <select id="fPag" aria-label="Página" class="largo">${F.explorador.map(x => `<option value="${esc(x.path)}"${x.path === UI.pagina ? " selected" : ""}>${esc(x.titulo.slice(0, 90))}</option>`).join("")}</select></header><div id="exp"></div>`);
  c.append(b);
  const desenha = () => {
    const x = F.explorador.find(y => y.path === UI.pagina);
    if(!x){ b.querySelector("#exp").innerHTML = `<p class="sb">Sem dados no período.</p>`; return; }
    const lista = (l, cor) => barras(l.map(([n, v]) => ({n, v, t:int(v), d:`${pc(div(v, x.pv))} das vistas da página`})), {cor});
    const termos = D.termos_pagina[x.path] || [];
    b.querySelector("#exp").innerHTML = `<p class="sb">${ligacao(x.path, x.path)} · ${int(x.pv)} páginas vistas</p><div class="tres">
      <div><h3 class="st">Veio de</h3>${lista(x.de, "var(--c2)")}</div>
      <div><h3 class="st">Foi para</h3>${lista(x.para, "var(--c1)")}</div>
      <div><h3 class="st">Clicou para fora</h3>${x.fora.length ? lista(x.fora, "var(--c5)") : `<p class="sb">Nenhum clique para fora registrado.</p>`}
      <h3 class="st" style="margin-top:14px">Buscas do Google (30 dias)</h3>${termos.length ? lista(termos.slice(0, 6), "var(--c3)") : `<p class="sb">Sem termos mostrados pelo Google.</p>`}</div></div>`;
  };
  desenha();
  b.querySelector("#fPag").onchange = e => { UI.pagina = e.target.value; desenha(); };
  add(c, glossario([
    ["Passo", "Cada área do site visitada na sessão, na ordem. Sessão com uma só área é quem entrou e saiu dali, mesmo vendo várias páginas."],
    ["Saiu", "A sessão termina naquela área. Saída sem clique registrado pode ser só a pessoa satisfeita: quem veio ler uma notícia e saiu não abandonou nada."],
    ["Site de venda e Outro site", `Clique para outro domínio. Desde ${dbr(D.inicio_clique_clube)} conta também o clique para ingressos, nacao, nacaoexperience, biometria e gratuidade.flamengo.com.br. Antes dessa data, e para os demais subdomínios, o clique não é registrado e parece saída.`],
  ]));
}

/* ============================ 7. Público ============================ */
function tabelaRetencao(lista, rotuloBase){
  if(!lista.length) return `<p class="sb">Sem dados.</p>`;
  const semanas = 8, linhas = lista.slice(-16);
  let t = `<div class="tw"><table class="mx"><thead><tr><th>Chegou na semana de</th><th class="r">${esc(rotuloBase)}</th>${Array.from({length:semanas}, (_, i) => `<th class="r">Sem. ${i + 1}</th>`).join("")}</tr></thead><tbody>`;
  linhas.forEach(r => {
    t += `<tr><th>${dbr(r.coorte)}</th><td class="r">${int(r.usuarios)}</td>`;
    for(let i = 1; i <= semanas; i++){ const v = r.semanas[i];
      t += v === null || v === undefined ? `<td class="hc nulo"></td>` : celula(Math.min(1, v*5), pc(v), `${pc(v)} voltaram na semana ${i}`); }
    t += `</tr>`;
  });
  return t + `</tbody></table></div>`;
}

  add(c, bloco("Hora e dia da semana", "Sessões iniciadas, no horário de Brasília. Cor mais escura é mais sessões. Passe o mouse para ver o número.", hm + `</tbody></table></div>`));
  add(c, duas(
    bloco("Estados", "Só Brasil.", barras(Pb.estados.slice(0, 12).map(x => ({n:x.estado, v:x.sessoes, t:int(x.sessoes)})))),
    bloco("Cidades", "", barras(Pb.cidades.slice(0, 12).map(x => ({n:x.cidade, v:x.sessoes, t:int(x.sessoes), d:x.estado}))))));
  add(c, duas(
    bloco("Países", "", barras(Pb.paises.slice(0, 8).map(x => ({n:x.pais, v:x.sessoes, t:int(x.sessoes)})))),
    bloco("Idioma do site e navegador", "Páginas vistas por versão do site, depois sessões por navegador.", barras(Pb.idiomas.map(x => ({n:{PT:"Português", EN:"Inglês", ES:"Espanhol"}[x.idioma] || x.idioma, v:x.pv, t:int(x.pv)}))) + `<h3 class="st">Navegador</h3>` + barras(Pb.navegadores.slice(0, 5).map(x => ({n:x.navegador || "—", v:x.sessoes, t:pc(x.pct), d:int(x.sessoes) + " sessões"}))))));
  add(c, glossario([

}

/* ============================ 8. Logados ============================ */
const CHAVES = {"flamengo-hub-home-logged-out":"Home", "flamengo-hub-home-logged-out-en":"Home (inglês)", "flamengo-hub-home-logged-out-es":"Home (espanhol)", "dynamic-noticias-category-ingressos":"Lista de ingressos", "institutional-news-post-template":"Notícia", "futebol-proximos-jogos":"Próximos jogos", "flamengo-commerce-home":"Loja: início", "flamengo-commerce-plp-search":"Loja: busca", "flamengo-commerce-plp-category":"Loja: categoria", "flamengo-ultimas-noticias":"Últimas notícias", "ouvidoria":"Ouvidoria", "(sem página)":"Não informado"};
const nomeChave = k => CHAVES[k] || k;
function secLogados(c){
  const k = B.kpis, a = B.kpis_ant || {}, L = B.logados;
  add(c, `<div class="alerta-info"><b>Dois cuidados com esta aba.</b> Usuário logado é um piso: o site só identifica o login em banners, vitrines e buscas, e só desde ${dbr(D.inicio_user_id)}. E a contagem de login foi ajustada em ${dbr(D.inicio_login)}: compare login e cadastro só a partir dessa data.</div>`);
  add(c, `<div class="kpis">
    ${kpi("Usuários logados", fmt(k.logados), pc(k.pct_logados) + " dos usuários")}
    ${kpi("Contas distintas", fmt(k.user_ids), varTxt(k.user_ids, a.user_ids))}
    ${kpi("Logins", fmt(k.login), P.ini >= D.inicio_login ? varTxt(k.login, a.login) : "período inclui o ajuste")}
    ${kpi("Cadastros", fmt(k.cadastro), P.ini >= D.inicio_login ? varTxt(k.cadastro, a.cadastro) : "período inclui o ajuste")}
    ${kpi("Sessões em Entrar", fmt(L.entrar), `${pc(div(L.entrar_ok, L.entrar))} logaram ou se cadastraram`)}
  </div>`);
  const dias = diasDoPeriodo(), rot = dias.map(r => dbr(r.data));
  const marco = rot.indexOf(dbr(D.inicio_login));
  const mk = marco >= 0 ? [{i:marco, cor:"var(--c4)", txt:"Contagem de login ajustada"}] : [];
  blocoGrafico(c, "Login e cadastro por dia", "", grafico([{nome:"Logins", cor:"var(--c1)", valores:dias.map(r => r.login)}, {nome:"Cadastros", cor:"var(--c2)", valores:dias.map(r => r.cadastro)}], rot, {marcos:mk, legendaMarcos:mk.length ? [`<span><i style="background:var(--c4);border-radius:50%"></i>contagem ajustada</span>`] : [], h:210}));
  blocoGrafico(c, "Usuários logados por dia", "", grafico([{nome:"Logados", cor:"var(--c3)", valores:dias.map(r => r.data >= D.inicio_user_id ? r.logados : null)}], rot, {h:180}));
  add(c, bloco("Sessão logada e não logada", "A sessão logada é a que teve o login identificado ou passou por Minha conta. Quem loga já tende a ser mais engajado: a diferença não prova que o login cause o comportamento.",
    tabela([{t:"Sessão", f:o => esc(o.tipo)}, {t:"Sessões", r:1, f:o => int(o.sessoes)}, {t:"Pág./sessão", r:1, f:o => dec(o.pv_sessao)}, {t:"Tempo", r:1, f:o => seg(o.tempo_s)}, {t:"Engajadas", r:1, f:o => pc(o.pct_engajadas)}, {t:"Viu ingressos", r:1, f:o => pc(o.pct_ingressos)}, {t:"Viu loja", r:1, f:o => pc(o.pct_loja)}, {t:"Comprou", r:1, f:o => pc(o.pct_compra)}], L.comparativo)));
  const grupos = [...new Set(L.areas.map(x => x.grupo))], porT = (lg, g) => (L.areas.find(x => x.logada === lg && x.grupo === g) || {}).pct || 0;
  const ordenados = grupos.sort((x, y) => porT(true, y) - porT(true, x));
  add(c, bloco("Onde cada sessão passa o tempo", "Parcela das páginas vistas em cada área.", tabela([{t:"Área", f:g => esc(g)}, {t:"Logada", r:1, f:g => pc(porT(true, g))}, {t:"Não logada", r:1, f:g => pc(porT(false, g))}], ordenados)));
  add(c, duas(
    bloco("Onde o login acontece", "A página em que o site registra o login concluído.", tabela([{t:"Página", f:o => esc(nomeChave(o.pagina))}, {t:"Logins", r:1, f:o => int(o.n)}, {t:"Usuários", r:1, f:o => int(o.usuarios)}], L.origens_login.slice(0, 10))),
    bloco("Onde o cadastro acontece", "", tabela([{t:"Página", f:o => esc(nomeChave(o.pagina))}, {t:"Cadastros", r:1, f:o => int(o.n)}, {t:"Usuários", r:1, f:o => int(o.usuarios)}], L.origens_cadastro.slice(0, 10)))));
  add(c, bloco("Retorno de contas logadas", `Pela conta, não pelo navegador, então vale entre aparelhos. A semana é a da 1ª vez que a conta foi vista desde ${dbr(D.inicio_user_id)}, não a do cadastro. Não muda com o período.`, tabelaRetencao(D.retencao_logados, "Contas")));
  add(c, glossario([
    ["Conta distinta", "Identificador do login. Uma pessoa com dois aparelhos é uma conta e dois usuários."],
    ["Cadastro", "Evento de cadastro concluído enviado pelo site, com a contagem como está no GA4."],
  ]));
}

/* ============================ 9. Cliques e banners ============================ */
function secCliques(c){
  const C = B.cliques;
  add(c, duas(
    bloco("Para onde o site manda as pessoas", `${fmt(C.total)} cliques para outros domínios. Os principais subdomínios do clube só contam desde ${dbr(D.inicio_clique_clube)}.`, barras(C.grupos.map(x => ({n:x.grupo, v:x.cliques, t:int(x.cliques), d:`${int(x.sessoes)} sessões`})))),
    bloco("Patrocinadores", "Cliques para sites de patrocinadores, por domínio.", tabela([{t:"Site", f:o => esc(o.dominio)}, {t:"Cliques", r:1, f:o => int(o.cliques)}, {t:"Sessões", r:1, f:o => int(o.sessoes)}], C.patrocinadores))));
  add(c, bloco("Banners por posição", "Taxa é cliques ÷ exibições. Um banner em carrossel pode ser exibido muitas vezes para a mesma pessoa.", tabela([{t:"Posição", f:o => esc(o.posicao)}, {t:"Exibições", r:1, f:o => int(o.vistas)}, {t:"Cliques", r:1, f:o => int(o.cliques)}, {t:"Taxa", r:1, f:o => pc(o.taxa)}], C.posicoes)));
  add(c, bloco("Banners mais clicados", "", tabela([{t:"Banner", w:1, f:o => esc(o.promocao)}, {t:"Posição", f:o => esc(o.posicao)}, {t:"Exibições", r:1, f:o => int(o.vistas)}, {t:"Cliques", r:1, f:o => int(o.cliques)}, {t:"Taxa", r:1, f:o => pc(o.taxa)}], C.banners.slice(0, 25))));
  add(c, bloco("Todos os destinos", "", tabela([{t:"Site", f:o => esc(o.dominio)}, {t:"Grupo", f:o => esc(o.grupo)}, {t:"Cliques", r:1, f:o => int(o.cliques)}, {t:"Sessões", r:1, f:o => int(o.sessoes)}], C.dominios.slice(0, 30))));
  add(c, glossario([
    ["Patrocinadores", "Sites de patrocinadores conhecidos e qualquer link marcado como patrocínio no site."],
    ["Clique para fora", "Medido automaticamente pelo GA4. Sem consentimento, o clique conta, mas não tem sessão."],
  ]));
}

/* ============================ 10. Loja ============================ */
function secLoja(c){
  const L = B.loja;
  if(!L){ add(c, bloco("Dados da loja indisponíveis", "O Painel E-commerce não respondeu nesta atualização. As outras abas não dependem dele.", "")); return; }
  const k = L.kpis, a = L.kpis_ant || {}, comparar = a.dias_ok && a.dias_ok >= Math.min(7, a.dias/2);
  add(c, `<div class="alerta-info">Resumo da loja. O detalhe (cupons, pagamento, tamanhos, redes) fica no <a class="lk" href="${esc(D.link_ecommerce)}" target="_blank" rel="noopener noreferrer">Painel E-commerce</a>, que usa as mesmas regras e tem senha própria.${k.dias_ok < k.dias ? ` <b>${k.dias - k.dias_ok} de ${k.dias} dias do período estão sem medição confiável das compras e ficam fora dos totais.</b>` : ""}</div>`);
  if(!k.dias_ok){ add(c, bloco("Nenhum dia com compras medidas neste período", "", "")); return; }
  const v = (x, y) => comparar ? varTxt(x, y) : `<span class="flat">sem comparação</span>`;
  // o período anterior pode ter outro número de dias medidos: o total enganaria, a média por dia medido não
  const vd = (x, y) => comparar ? varTxt(x/k.dias_ok, y/a.dias_ok, " por dia medido") : `<span class="flat">sem comparação</span>`;
  add(c, `<div class="kpis">
    ${kpi("Receita", brl(k.receita), vd(k.receita, a.receita))}
    ${kpi("Pedidos", int(k.pedidos), vd(k.pedidos, a.pedidos))}
    ${kpi("Ticket médio", brl2(k.ticket), v(k.ticket, a.ticket))}
    ${kpi("Itens por pedido", dec(k.itens_por_pedido), v(k.itens_por_pedido, a.itens_por_pedido))}
    ${kpi("Conversão", pc(k.conversao).replace(/^(\d+),(\d)%$/, "$1,$2%"), "pedidos ÷ sessões da loja")}
    ${kpi("Dias medidos", `${k.dias_ok} de ${k.dias}`, "")}
  </div>`);
  const dias = D.serie_loja.filter(r => r.data >= P.ini && r.data <= P.fim), rot = dias.map(r => dbr(r.data));
  blocoGrafico(c, "Receita por dia, em R$", "Dias em cinza: a medição do checkout falhou, não as vendas.", grafico([{nome:"Receita", cor:"var(--c1)", tipo:"barra", fmt:brl, valores:dias.map(r => r.selo === "ok" ? r.receita : null)}], rot, {faixas:dias.map(r => r.selo !== "ok"), rotuloFaixa:"sem medição do checkout", h:210, marcos:marcosJogos(rot), legendaMarcos:[legJogo]}));
  const fun = L.funil.filter(e => e.sessoes > 0), topo = fun.length ? fun[0].sessoes : 0;
  add(c, duas(
    bloco("Funil da loja", L.dias_funil ? `${L.dias_funil} dias com todas as etapas medidas. Sessões que chegaram a cada etapa.` : "Nenhum dia do período tem todas as etapas medidas.",
      L.dias_funil ? barras(fun.map(e => ({n:e.etapa, v:e.sessoes, t:int(e.sessoes), d:pc(div(e.sessoes, topo)) + " da primeira etapa"}))) : ""),
    bloco("Por canal", "", tabela([{t:"Canal", f:o => esc(o.canal)}, {t:"Receita", r:1, f:o => brl(o.receita)}, {t:"Pedidos", r:1, f:o => int(o.pedidos)}], L.canais))));
  add(c, duas(
    bloco("Produtos que mais venderam", "", tabela([{t:"Produto", w:1, f:o => esc(o.produto)}, {t:"Receita", r:1, f:o => brl(o.receita)}, {t:"Qtde", r:1, f:o => int(o.quantidade)}], L.produtos)),
    bloco("Categorias", "", barras(L.categorias.map(x => ({n:x.categoria, v:x.receita, t:brl(x.receita)}))))));
  add(c, glossario([
    ["Fonte", "GA4, com as regras do Painel E-commerce. Não é o valor oficial da VTEX."],
    ["Dias sem medição", "A etiqueta do checkout já falhou em 11–26/08 e em 22/09–22/10. Esses dias nunca contam como venda zero."],
    ["Sessão da loja", "Viu vitrine, produto ou carrinho. Sessão só de notícia não entra na conversão."],
  ]));
}

/* ============================ 11. Histórico ============================ */
function secHistorico(c){
  const H = D.historico.meses;
  add(c, `<div class="alerta-info"><b>Antes e depois da migração de ${dbr(D.migracao)}/2026.</b> Números da tela do GA4 nos dois lados, para a comparação ser justa. Os usuários ficam acima dos das outras abas, porque a tela estima quem não consentiu. O site novo também muda a medição: por isso páginas e tempo por sessão quase dobram na virada. Sessões e usuários são a melhor base de comparação.</div>`);
  const nomes = {sessoes:"Sessões", usuarios:"Usuários", pv:"Páginas vistas"};
  const rot = H.map(x => mesbr(x.mes)), mig = H.findIndex(x => x.mes === D.migracao.slice(0, 7));
  const b = blocoGrafico(c, nomes[UI.hist] + " por mês", `De ${mesbr(H[0].mes)} a ${mesbr(H[H.length - 1].mes)}. ${mesbr(H[0].mes)} é o mês de início da propriedade e está incompleto.`,
    grafico([{nome:nomes[UI.hist], cor:"var(--c1)", tipo:"barra", valores:H.map(x => x[UI.hist]), cores:H.map((x, i) => i >= mig ? "var(--c1)" : "var(--rule-2)")}], rot, {marcos:[{i:mig, cor:"var(--ink-3)", txt:"Migração do site"}], h:260,
      legendaMarcos:[`<span><i style="background:var(--rule-2)"></i>site antigo</span>`, `<span><i style="background:var(--c1)"></i>site novo</span>`]}),
    seletor("sHist", [["sessoes", "Sessões"], ["usuarios", "Usuários"], ["pv", "Páginas vistas"]], UI.hist));
  ligaSeletor(b, "sHist", v => { UI.hist = v; render(); });
  const porMes = {}; H.forEach(x => porMes[x.mes] = x);
  const yoy = (x, k) => { const a = porMes[String(+x.mes.slice(0, 4) - 1) + x.mes.slice(4)]; return a ? varTxt(x[k], a[k]) : `<span class="flat">—</span>`; };
  add(c, bloco("Mês a mês, contra o mesmo mês do ano anterior", "", tabela([
    {t:"Mês", f:o => mesbr(o.mes) + (o.mes === D.migracao.slice(0, 7) ? ` <span class="sel">migração</span>` : "")},
    {t:"Sessões", r:1, f:o => int(o.sessoes)}, {t:"x ano ant.", r:1, f:o => yoy(o, "sessoes")},
    {t:"Usuários", r:1, f:o => int(o.usuarios)}, {t:"x ano ant.", r:1, f:o => yoy(o, "usuarios")},
    {t:"Páginas vistas", r:1, f:o => int(o.pv)}, {t:"x ano ant.", r:1, f:o => yoy(o, "pv")},
    {t:"Pág./sessão", r:1, f:o => dec(div(o.pv, o.sessoes))}, {t:"Tempo/sessão", r:1, f:o => seg(o.tempo_sessao_s)}, {t:"Engajadas", r:1, f:o => pc(div(o.engajadas, o.sessoes))}],
    H.slice().reverse().slice(0, 16))));
  const CH = D.historico.canais, topo = ["Busca orgânica", "Direto", "Redes sociais", "Outros sites", "E-mail"], cores = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)"];
  blocoGrafico(c, "Sessões por canal, mês a mês", "Os cinco canais de maior volume.", grafico(topo.map((n, i) => ({nome:n, cor:cores[i], valores:H.map(x => { const r = CH.find(y => y.mes === x.mes && y.canal === n); return r ? r.sessoes : null; })})), rot, {h:260, marcos:[{i:mig, cor:"var(--ink-3)", txt:"Migração do site"}]}));
  const SM = D.search_mensal;
  if(SM.length){
    const rs = SM.map(x => mesbr(x.mes)), ms = SM.findIndex(x => x.mes === D.migracao.slice(0, 7));
    blocoGrafico(c, "Cliques do Google por mês", "API do Search Console, só o Hub, que guarda cerca de 16 meses. Só meses inteiros.", grafico([{nome:"Busca", cor:"var(--c1)", valores:SM.map(x => x.web)}, {nome:"Discover", cor:"var(--c2)", valores:SM.map(x => x.discover)}], rs, {h:220, marcos:ms >= 0 ? [{i:ms, cor:"var(--ink-3)", txt:"Migração do site"}] : []}));
  }
  add(c, glossario([
    ["Fonte", "Tela do GA4, lida em 04/11/2026 e guardada no painel. Não se atualiza sozinha. O site antigo tinha outra estrutura, então só faz sentido comparar totais, não páginas."],
    ["Meses desiguais", "Junho de 2023 está incompleto. A migração aconteceu em 03/08/2026, e agosto de 2026 mistura os dois sites."],
  ]));
}

/* ============================ navegação ============================ */
const ABAS = [["geral", "Visão geral", secGeral], ["noticias", "Notícias", secNoticias], ["ingressos", "Ingressos", secIngressos], ["origem", "Origem", secOrigem], ["buscas", "Buscas", secBuscas], ["fluxos", "Fluxos", secFluxos], ["publico", "Público", secPublico], ["logados", "Logados", secLogados], ["cliques", "Cliques e banners", secCliques], ["loja", "Loja", secLoja], ["historico", "Histórico", secHistorico]];
function montaAbas(){
  const c = document.getElementById("abas");
  c.innerHTML = ABAS.map(a => `<button class="ab" role="tab" data-a="${a[0]}" aria-selected="${a[0] === ABA}">${a[1]}</button>`).join("");
  c.querySelectorAll("button").forEach(b => b.onclick = () => { ABA = b.dataset.a; render(); scrollTo(0, 0); });
}
function barraPeriodo(){
  const c = document.getElementById("periodo");
  if(ABA === "historico"){ c.innerHTML = ""; return; }
  c.innerHTML = `<div class="bloco barra"><div class="ctl">${seletor("sPer", D.periodos.map(p => [p.id, p.nome]), PID)}</div>
    <p class="sb" style="margin:8px 0 0">${dbr(P.ini)} a ${dbr(P.fim)}${P.ant ? ` · comparação com ${dbr(P.ant_ini)} a ${dbr(P.ant_fim)}` : " · sem período anterior para comparar"}</p></div>`;
  ligaSeletor(c, "sPer", v => { PID = v; UI.maisNoticias = false; UI.maisTermos = false; render(); });
}
function render(){
  P = D.periodos.find(p => p.id === PID); B = D.blocos[PID];
  montaAbas(); barraPeriodo();
  const c = document.getElementById("conteudo"); c.innerHTML = "";
  ABAS.find(a => a[0] === ABA)[2](c);
}
function iniciar(){
  document.getElementById("carimbo").innerHTML = `site até ${dbr(D.data_base)} · Google até ${dbr(D.ultimo_search)}<br>gerado em ${esc(D.gerado_em)}`;
  document.getElementById("avisos").innerHTML = D.avisos.length ? `<div class="alerta-fonte"><b>Atenção</b><ul>${D.avisos.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>` : "";
  document.getElementById("rodape").innerHTML = `Dados do GA4 (export no BigQuery, desde ${dbr(D.inicio_export)}), do Search Console e do Painel E-commerce. Corte na migração do site, em ${dbr(D.migracao)}/2026.`;
  render();
}
</script>
